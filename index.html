<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>萬年曆帳本｜西松高中自由車隊</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3f3;color:#153438;font:1rem system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:1rem}header,section{padding:1rem 1.25rem;border-radius:14px;margin-bottom:1rem;background:white}header{background:#153438;color:white}h1,h2{margin:.3rem 0 .8rem}label{display:inline-grid;gap:.25rem;margin:.25rem .5rem .25rem 0}button,input,select{font:inherit;padding:.45rem;border:1px solid #7d9595;border-radius:6px}button{background:#f4f8f8;cursor:pointer}button[aria-pressed=true],.primary{background:#146b60;color:white}#days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.25rem;text-align:center}#days button{min-height:2.4rem;padding:.15rem}#totals{line-height:1.8}.row{padding:.75rem 0;border-top:1px solid #c8d6d6}.row strong{display:block;margin-bottom:.35rem;overflow-wrap:anywhere}.row button{margin:.2rem}#status{min-height:1.4em}#backup{margin:.3rem 0}
</style>
<main>
<header><h1>西松高中自由車隊｜萬年曆帳本</h1><p>收支與憑證儲存在目前瀏覽器。清除網站資料或換裝置前，請下載完整備份。</p></header>
<section>
<h2>選擇日期</h2><label>年份<input id="year" type="number" min="1900" max="9999" required></label><label>月份<select id="month"></select></label>
<div id="days" aria-label="月曆"></div><p id="totals"></p><p id="annual"></p>
</section>
<section><h2 id="entryTitle">新增收支</h2>
<form id="entry">
<label>日期<input id="date" type="date" required></label>
<label>類型<select id="kind"><option value="income">收入</option><option value="expense">支出</option></select></label>
<label>品名／摘要<input id="title" required maxlength="180"></label>
<label>金額（元）<input id="amount" type="number" min="0.01" max="100000000" step="0.01" required></label>
<label>備註<input id="note" maxlength="400"></label>
<label>憑證（JPG、PNG、PDF，最多 8 MB）<input id="receipt" type="file" accept="image/jpeg,image/png,application/pdf"></label>
<button class="primary">儲存收支</button> <button type="button" id="cancel" hidden>取消編輯</button>
</form>
<p id="status" role="status"></p><h2 id="dayTitle"></h2><div id="records"></div>
</section>
<section><h2>期初餘額、備份與月報</h2>
<form id="opening"><label>帳本起始餘額（元）<input id="balance" type="number" step=".01" min="-100000000" max="100000000" required></label><button>儲存餘額</button></form>
<p>起始餘額適用於第一筆紀錄之前。月末餘額會自動結轉到次月，跨年時也會結轉。</p>
<button id="backup">下載完整備份</button>
<label>還原完整備份<input id="restore" type="file" accept=".json,application/json"></label>
<label>合併既有家長月報（選填）<input id="existing" type="file" accept=".json,application/json"></label>
<button id="summary">下載本月家長摘要</button>
<p>摘要檔只含月度金額。合併既有檔案可保留其他月份。下載後可上傳至家長版儲存庫的 ledger-summary.json。</p>
</section></main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const today = new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Taipei'}).format(new Date());
const pad = value => String(value).padStart(2,'0');
const money = cents => (cents/100).toLocaleString('zh-TW',{maximumFractionDigits:2})+' 元';
const monthKey = () => $('year').value+'-'+pad($('month').value);
const media = new Set(['image/jpeg','image/png','application/pdf']);
const sizeLimit = 8*1024*1024;
let state = {opening:0, rows:[]}, editing = null;
const db = new Promise((resolve,reject)=>{
 const request=indexedDB.open('xisong-workstation-ledger',1);
 request.onupgradeneeded=()=>request.result.createObjectStore('ledger');
 request.onsuccess=()=>resolve(request.result);
 request.onerror=()=>reject(request.error);
});
async function storage(mode, operation){
 const database=await db;
 return new Promise((resolve,reject)=>{
  const transaction=database.transaction('ledger',mode);
  const request=operation(transaction.objectStore('ledger'));
  transaction.oncomplete=()=>resolve(request.result);
  transaction.onabort=()=>reject(transaction.error);
 });
}
async function save(next){
 await storage('readwrite',store=>store.put(next,'data'));
 state=next;
}
function totals(prefix){
 let opening=state.opening, income=0, expense=0;
 for(const row of state.rows){
  if(row.date.startsWith(prefix)) {
   if(row.kind==='income')income+=row.amount;
   else expense+=row.amount;
  }else if(row.date.slice(0,prefix.length)<prefix){
   opening+=row.kind==='income'?row.amount:-row.amount;
  }
 }
 return {opening,income,expense,closing:opening+income-expense};
}
function describe(value){
 return '期初 '+money(value.opening)+' ｜ 收入 '+money(value.income)+' ｜ 支出 '+money(value.expense)+' ｜ 期末 '+money(value.closing);
}
function button(name,action){
 const node=document.createElement('button');
 node.type='button';node.textContent=name;node.onclick=action;
 return node;
}
function feedback(message){$('status').textContent=message}
function setDate(date){
 $('year').value=date.slice(0,4);
 $('month').value=Number(date.slice(5,7));
 $('date').value=date;
}
function reset(date){
 editing=null;
 $('entry').reset();
 setDate(date);
 $('entryTitle').textContent='新增收支';
 $('cancel').hidden=true;
}
function download(name,blob){
 const url=URL.createObjectURL(blob), anchor=document.createElement('a');
 anchor.href=url;anchor.download=name;anchor.click();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function jsonFile(name,object){download(name,new Blob([JSON.stringify(object,null,2)],{type:'application/json'}))}
function render(){
 const key=monthKey(), date=$('date').value;
 const y=Number($('year').value),m=Number($('month').value);
 $('days').replaceChildren(...[...'日一二三四五六'].map(day=>Object.assign(document.createElement('span'),{textContent:day})));
 const offset=new Date(Date.UTC(y,m-1,1)).getUTCDay();
 for(let i=0;i<offset;i++)$('days').append(document.createElement('span'));
 for(let day=1;day<=new Date(Date.UTC(y,m,0)).getUTCDate();day++){
  const target=key+'-'+pad(day);
  const count=state.rows.filter(row=>row.date===target).length;
  const node=button(day+(count?' · '+count:''),()=>{reset(target);render()});
  node.setAttribute('aria-pressed',String(target===date));
  $('days').append(node);
 }
 $('totals').textContent=key+' ｜ '+describe(totals(key));
 $('annual').textContent=y+' 年 ｜ '+describe(totals(String(y)));
 $('balance').value=state.opening/100;
 $('dayTitle').textContent=date+' 收支明細';
 $('records').replaceChildren();
 for(const row of state.rows.filter(row=>row.date===date)){
  const item=document.createElement('div');item.className='row';
  const label=document.createElement('strong');
  label.textContent=(row.kind==='income'?'收入':'支出')+' ｜ '+row.title+' ｜ '+money(row.amount);
  item.append(label,document.createTextNode(row.note||''));
  item.append(button('編輯',()=>{
   reset(row.date);editing=row;
   for(const key of ['kind','title','note'])$(key).value=row[key];
   $('amount').value=row.amount/100;
   $('entryTitle').textContent='編輯收支';
   $('cancel').hidden=false;$('title').focus();
  }));
  if(row.receipt)item.append(button('下載憑證',async()=>{
   try{download(row.receiptName,await (await fetch(row.receipt)).blob())}catch{feedback('憑證無法讀取。')}
  }));
  item.append(button('移除',async()=>{
   if(!confirm('移除這筆收支與憑證？'))return;
   try{await save({...state,rows:state.rows.filter(other=>other.id!==row.id)});reset(date);render();feedback('已移除。')}catch{feedback('移除失敗。')}
  }));
  $('records').append(item);
 }
 if(!$('records').children.length)$('records').textContent='當日尚無紀錄。';
}
function readReceipt(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(file);
 });
}
function operation(id,event,run){
 $(id).addEventListener(event,async e=>{
  e.preventDefault();
  const control=e.submitter||(event==='click'?e.currentTarget:null);
  if(control)control.disabled=true;
  try{await run()}catch(error){feedback(error.message||'操作失敗。')}
  finally{if(control)control.disabled=false}
 });
}
function validDate(value){
 return typeof value==='string' && /^\d{4}-\d{2}-\d{2}$/.test(value) &&
  Number(value.slice(0,4))>=1900 && Number.isFinite(Date.parse(value)) &&
  new Date(value).toISOString().slice(0,10)===value;
}
function validRow(row){
 return row && typeof row.id==='string' && validDate(row.date) &&
  ['income','expense'].includes(row.kind) && typeof row.title==='string' && typeof row.note==='string' &&
  Number.isSafeInteger(row.amount) && row.amount>0 && row.amount<=10000000000 &&
  (!row.receipt || (typeof row.receiptName==='string' && typeof row.receipt==='string' &&
    /^data:(image\/jpeg|image\/png|application\/pdf);base64,[A-Za-z0-9+/=]+$/.test(row.receipt) &&
    row.receipt.length<=Math.ceil(sizeLimit/3)*4+64));
}
async function init(){
 state=await storage('readonly',store=>store.get('data'))||state;
 for(let m=1;m<=12;m++)$('month').add(new Option(m+' 月',m));
 reset(today);render();
 for(const id of ['year','month'])$(id).onchange=()=>{
  if(!$('year').checkValidity())return;
  reset(monthKey()+'-01');render();
 };
 $('date').onchange=()=>{if(validDate($('date').value)){setDate($('date').value);render()}};
 $('cancel').onclick=()=>{reset($('date').value);render()};
 operation('entry','submit',async()=>{
  const date=$('date').value, file=$('receipt').files[0];
  if(!validDate(date)||!$('title').value.trim())throw new Error('請填寫有效日期及品名。');
  if(file&&(!media.has(file.type)||file.size>sizeLimit))throw new Error('請選擇 8 MB 以下的 JPG、PNG 或 PDF。');
  const row={
   id:editing?.id||crypto.randomUUID(),date,kind:$('kind').value,title:$('title').value.trim(),
   amount:Math.round(Number($('amount').value)*100),note:$('note').value,
   receipt:file?await readReceipt(file):editing?.receipt||null,
   receiptName:file?.name||editing?.receiptName||null
  };
  await save({...state,rows:[...state.rows.filter(other=>other.id!==row.id),row]});
  reset(date);render();feedback('已儲存。');
 });
 operation('opening','submit',async()=>{
  await save({...state,opening:Math.round(Number($('balance').value)*100)});
  render();feedback('已更新起始餘額。');
 });
 operation('backup','click',()=>jsonFile('xisong-ledger-backup.json',{version:1,...state}));
 operation('restore','change',async()=>{
  const file=$('restore').files[0];
  if(!file)return;
  try{
   const data=JSON.parse(await file.text());
   if(data.version!==1||!Number.isSafeInteger(data.opening)||Math.abs(data.opening)>10000000000||
      !Array.isArray(data.rows)||!data.rows.every(validRow)||
      new Set(data.rows.map(row=>row.id)).size!==data.rows.length)throw new Error('備份格式不符。');
   if(!confirm('以備份取代本瀏覽器中的帳本？'))return;
   await save({opening:data.opening,rows:data.rows});reset(today);render();feedback('已還原。');
  }finally{$('restore').value=''}
 });
 operation('summary','click',async()=>{
  const month=monthKey();
  const input=$('existing').files[0];
  const reports=input?JSON.parse(await input.text()).reports:[];
  const keys=['opening','income','expense','closing'];
  if(!Array.isArray(reports)||!reports.every(row=>row&&/^\d{4}-(0[1-9]|1[0-2])$/.test(row.month)&&keys.every(key=>typeof row[key]==='number'&&Number.isFinite(row[key]))))
   throw new Error('家長月報格式不符。');
  const clean=reports.filter(row=>row.month!==month).map(row=>({month:row.month,...Object.fromEntries(keys.map(key=>[key,row[key]]))}));
  const values=totals(month);
  clean.push({month,...Object.fromEntries(keys.map(key=>[key,values[key]/100]))});
  clean.sort((a,b)=>a.month.localeCompare(b.month));
  jsonFile('ledger-summary.json',{year:Number(month.slice(0,4)),reports:clean});
 });
}
init().catch(()=>feedback('這個瀏覽器無法開啟本機帳本。請確認網站儲存空間可用。'));
</script>
</html>

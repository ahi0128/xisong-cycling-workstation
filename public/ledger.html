<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隊費與核銷｜西松自由車隊</title><link rel="stylesheet" href="/style.css"><main style="max-width:1200px;margin:auto;padding:20px"><section class="hero"><span class="pill">西松高中自由車隊</span><h1 id="title">隊費與核銷</h1><p id="intro">共用帳本與已發布月報</p><a id="home" href="/" hidden style="color:white">返回籌備工作站</a></section><p id="feedback" role="status" aria-live="polite"></p><section id="admin" hidden><p class="hint">18 戶方案每戶每月約 2,299 元，繳納金額與方式待確認。<a href="/coach-plan#dues">查看隊費試算與依據</a></p><h2>隊費收支表</h2><p>收到款項後登錄收入。支出先存草稿，附憑證或憑證編號，核銷入帳後計入結算。</p><div class="toolbar"><label>起日<input id="start" type="date"></label><label>迄日<input id="end" type="date"></label><button id="refresh">查詢</button><button id="add" class="primary">新增收支</button><button id="csv">匯出 CSV</button></div><div id="totals" class="metrics"></div><div id="records" class="tablewrap"></div><form id="publish" class="card" style="margin-top:16px"><h2>發布家長月報</h2><div class="fields"><label>結算月份<input name="month" type="month" required></label><label class="wide">家長公告<textarea name="announcement" maxlength="2000"></textarea></label></div><button class="primary">發布／更新月報</button></form></section><p><a href="/parent-dues">家長版隊費說明</a></p><section id="reportSection"><h2 style="margin:24px 0 12px">已發布月報</h2><div id="reports"></div></section></main>
<dialog id="entryDialog"><form id="entryForm"><h2>收支紀錄</h2><div class="fields"><label>日期<input name="day" type="date" required></label><label>類型<select name="kind"><option>收入</option><option>支出</option><option>期初餘額</option></select></label><label>分類<input name="category" required maxlength="50" list="categories"></label><datalist id="categories"><option>隊費</option><option>家長支持</option><option>校方經費</option><option>教練費</option><option>隊車油料</option><option>車輛耗損</option><option>補給飲水</option><option>行政費</option></datalist><label>金額（整元）<input name="amount" type="number" min="1" max="100000000" step="1" required></label><label class="wide">摘要<input name="title" required maxlength="180"></label><label>憑證編號<input name="voucher" maxlength="120"></label><label class="wide">備註<textarea name="note" maxlength="1000"></textarea></label></div><p id="entryError" role="status"></p><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">儲存草稿</button></div></form></dialog>
<dialog id="uploadDialog"><form id="uploadForm"><h2>上傳收支憑證</h2><p>支援 JPG、PNG 與 PDF，每檔最多 8 MB。</p><label>檔案<input name="file" type="file" accept="image/jpeg,image/png,application/pdf" required></label><p id="uploadError" role="status"></p><div class="actions"><button type="button" id="cancelUpload">取消</button><button class="primary">上傳</button></div></form></dialog><dialog id="reviewDialog"><form id="reviewForm"><h2>支出核銷入帳</h2><div class="fields"><label>核銷日期<input name="day" type="date" required></label><label class="wide">核銷依據／單號<textarea name="reference" required maxlength="300"></textarea></label></div><p id="reviewError" role="status"></p><div class="actions"><button type="button" id="cancelReview">取消</button><button class="primary">確認核銷入帳</button></div></form></dialog><script src="/ledger.js"></script></html>
